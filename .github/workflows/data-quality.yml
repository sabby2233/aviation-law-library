name: Data Quality Gate

# 只做「构建 + 校验」，不采集、不改数据。
#
# 为什么删掉了自动采集任务（原 collect job）：
#   1. data/manifest.json、data/browse.json、data/details/、site/api/ 已改为
#      构建产物（.gitignore），干净检出时不存在 —— 原来那条
#      `validate.py --data data/manifest.json` 会在 checkout 后直接报文件不存在。
#   2. 原来的三个 `git diff --exit-code` 门禁已失效：路径不在版本控制里，
#      diff 恒为空，永远通过；且 `|| echo` 把非零退出码转成了 0，等于没有门禁。
#   3. 更要命的是采集任务会**静默毁掉已核验的成果**：
#      collect_caac.py / collect_eurlex.py 只重建元数据，不写 fullText，
#      跑一次就把 256 条民航局规章、6 条 EU 法规的正文清空；
#      collect_aviation_data_cases.py 会把已核验案例的 decisionDate 重置为 null。
#      这三处在采集器改成「保留既有 fullText 与 verification」之前，不能再自动跑。
#
# 重新启用采集前必须完成：
#   - collect_caac.py、collect_eurlex.py 改成 merge 语义（已有 fullText 则保留）
#   - collect_aviation_data_cases.py 不再重置 decisionDate / verification
#   - 采集后跑 finalize_caac_text.py 与 normalize_fulltext.py 补齐派生字段

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_manifest 取 commit SHA 需要历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 本仓库有 requirements.txt 才可开 cache。若日后删除它，务必同时删掉这一行，
          # 否则 setup-python 因找不到依赖文件直接失败，会拖垮整条流水线。
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 构建顺序即依赖顺序：manifest → browse（读 manifest）→ api（读 browse 与 records）
      - name: Build derived artifacts
        run: |
          python scripts/build_manifest.py
          python scripts/build_browse.py
          node scripts/build_api.js

      - name: Data quality assertions
        run: python scripts/validate.py --data data/manifest.json

      - name: Search engine regression test
        run: node site/test_search.js

      - name: Browse index keeps full-corpus recall
        run: node site/test_browse_parity.js

      - name: Summary
        if: always()
        run: |
          echo "记录数：$(python -c "import json;print(json.load(open('data/manifest.json'))['meta']['recordCount'])")"
          echo "断言数：$(python -c "import json;print(json.load(open('data/manifest.json'))['meta']['assertionCount'])")"
          echo "commit：$(git rev-parse --short HEAD)"
